name: Type Test
on: push
jobs:
  npm_test:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    name: Check types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: "yarn"
      - name: Run NPM Install
        run: yarn install --frozen-lockfile
      - name: Check types
        run: yarn test:types
